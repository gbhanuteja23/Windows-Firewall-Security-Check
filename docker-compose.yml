version: '3.8'

services:
  windows-firewall-check:
    build:
      context: .
      dockerfile: Dockerfile
    image: windows-firewall-security-check:latest
    container_name: windows-firewall-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
